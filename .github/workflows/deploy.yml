name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Create config.js with API keys
        run: |
          echo "window.API_CONFIG = {" > config.js
          echo "  WEATHER_API_KEY: '${{ secrets.WEATHER_API_KEY }}'," >> config.js
          echo "  YOUTUBE_API_KEY: '${{ secrets.YOUTUBE_API_KEY }}'," >> config.js
          echo "  IS_PRODUCTION: true," >> config.js
          echo "  DEBUG_MODE: true" >> config.js
          echo "};" >> config.js
          
          echo "console.log('✅ config.js created by GitHub Actions');" >> config.js
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          force_orphan: true